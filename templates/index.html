<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Think First Bot</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
      /* --- GLOBAL STYLES --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      html,
      body {
        height: 100%;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
        color: #e3e3e3;
        background-color: #020617;
        background-image:
          radial-gradient(
            at 10% 20%,
            rgba(14, 165, 233, 0.25) 0px,
            transparent 40%
          ),
          radial-gradient(
            at 80% 10%,
            rgba(99, 102, 241, 0.25) 0px,
            transparent 40%
          ),
          radial-gradient(
            at 50% 50%,
            rgba(6, 182, 212, 0.2) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 90% 80%,
            rgba(59, 130, 246, 0.25) 0px,
            transparent 40%
          ),
          radial-gradient(
            at 20% 80%,
            rgba(30, 58, 138, 0.4) 0px,
            transparent 40%
          );
        background-size: 150% 150%;
        animation: cosmicFlow 12s ease-in-out infinite alternate;
      }

      @keyframes cosmicFlow {
        0% {
          background-position: 0% 0%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 50% 100%;
        }
      }

      .chat-container {
        width: 100%;
        max-width: 850px;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        margin: 0 auto;
      }

      /* --- TOP DASHBOARD ELEMENTS --- */
      .stats-dashboard {
        position: fixed;
        top: 15px;
        left: 15px;
        display: flex;
        gap: 10px;
        z-index: 10;
        width: max-content;
        flex-wrap: wrap;
        max-width: 65%;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 8px 15px;
        border-radius: 12px;
        font-size: 0.85em;
        color: #e3e3e3;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .top-right-about {
        position: fixed;
        top: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 8px 15px;
        border-radius: 12px;
        font-size: 0.85em;
        color: #e3e3e3;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 500;
        font-weight: 500;
      }
      .top-right-about:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.4);
      }

      /* --- CHAT AREA --- */
      .chat-box {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 24px;
        scrollbar-width: none;
        margin-top: 70px;
        -webkit-overflow-scrolling: touch;
      }
      .chat-box::-webkit-scrollbar {
        display: none;
      }

      .chat-header {
        text-align: center;
        margin: auto 0;
        padding: 20px 0;
        transition: opacity 0.5s ease;
      }
      .gradient-text {
        font-size: 3.8em;
        font-weight: bold;
        letter-spacing: -2px;
        background: linear-gradient(
          74deg,
          #38bdf8 0,
          #818cf8 25%,
          #e0e7ff 50%,
          #e3e3e3 80%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sub-greeting {
        color: #cbd5e1;
        font-size: 1.5em;
        margin-top: 15px;
        opacity: 0.9;
        transition: opacity 0.3s ease;
      }

      .suggestions-container {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        padding: 20px 0;
        margin-top: 10px;
      }
      .suggestion-chip {
        background-color: rgba(255, 255, 255, 0.03);
        color: #e3e3e3;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 12px 20px;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        backdrop-filter: blur(10px);
        font-size: 0.95em;
        font-weight: 500;
      }
      .suggestion-chip:hover {
        background-color: rgba(255, 255, 255, 0.08);
        border-color: #38bdf8;
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      .message {
        width: fit-content;
        max-width: 85%;
        line-height: 1.6;
        font-size: 1.3em;
        animation: fadeIn 0.4s ease forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .user-message {
        align-self: flex-end;
        background-color: rgba(255, 255, 255, 0.1);
        padding: 14px 22px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .bot-message {
        align-self: flex-start;
      }

      /* --- BOTTOM SECTION --- */
      .bottom-section {
        padding-bottom: 25px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-left: 15px;
        padding-right: 15px;
        z-index: 100;
      }
      .bottom-area-row {
        display: flex;
        width: 100%;
        gap: 12px;
        align-items: center;
      }

      .input-wrapper {
        flex-grow: 1;
        background-color: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 50px;
        display: flex;
        align-items: center;
        padding: 8px 10px 8px 25px;
        gap: 15px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        transition:
          border-color 0.3s,
          box-shadow 0.3s,
          transform 0.3s;
      }
      .input-wrapper:hover {
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }
      .input-wrapper:focus-within {
        border-color: #38bdf8;
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
        transform: translateY(0);
      }

      input[type="text"] {
        flex-grow: 1;
        background: transparent;
        border: none;
        font-size: 1.2em;
        color: #e3e3e3;
        outline: none;
        width: 100%;
      }

      .send-btn {
        background: #ffffff;
        color: #020617;
        border: 1px solid transparent;
        height: 48px;
        min-width: 48px;
        padding: 0 24px;
        border-radius: 40px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
      }
      .send-btn:hover {
        background: #38bdf8;
        color: white;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        transform: scale(1.05);
      }
      .send-text {
        display: inline;
      }

      .outside-reveal-btn {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(244, 63, 94, 0.4);
        color: #f43f5e;
        height: 64px;
        border-radius: 50px;
        padding: 0 25px;
        font-weight: 600;
        font-size: 1.1em;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        white-space: nowrap;
      }
      .outside-reveal-btn:hover {
        background: rgba(244, 63, 94, 0.1);
        border-color: #f43f5e;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(244, 63, 94, 0.2);
      }

      /* ACTION BAR - FIXED CENTERING FOR ALL SCREENS */
      .action-bar {
        display: flex;
        gap: 15px;
        margin-top: 15px;
        justify-content: center;
        width: 100%;
        max-width: 100%;
      }
      .action-btn {
        background: rgba(255, 255, 255, 0.03);
        color: #e3e3e3;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
        font-size: 1em;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .action-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.4);
      }

      /* --- FULLSCREEN GAME OVERLAY --- */
      .game-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #020617;
        background-image:
          radial-gradient(
            at 10% 20%,
            rgba(14, 165, 233, 0.25) 0px,
            transparent 40%
          ),
          radial-gradient(
            at 80% 10%,
            rgba(99, 102, 241, 0.25) 0px,
            transparent 40%
          ),
          radial-gradient(
            at 50% 50%,
            rgba(6, 182, 212, 0.2) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 90% 80%,
            rgba(59, 130, 246, 0.25) 0px,
            transparent 40%
          ),
          radial-gradient(
            at 20% 80%,
            rgba(30, 58, 138, 0.4) 0px,
            transparent 40%
          );
        background-size: 150% 150%;
        animation: cosmicFlow 12s ease-in-out infinite alternate;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: 0.4s ease-in-out;
        overflow-y: auto;
      }
      .game-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .close-game-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background: none;
        border: none;
        color: white;
        font-size: 45px;
        cursor: pointer;
        opacity: 0.6;
        transition: 0.3s;
        z-index: 1001;
      }

      /* --- RESPONSIVE MEDIA QUERIES --- */
      @media (max-width: 768px) {
        .chat-box {
          margin-top: 60px;
          padding: 10px 15px;
          gap: 15px;
        }
        .gradient-text {
          font-size: 2.8em;
        }
        .sub-greeting {
          font-size: 1.1em;
        }

        .input-wrapper .send-btn {
          width: 44px !important;
          min-width: 44px !important;
          max-width: 44px !important;
          height: 44px !important;
          padding: 0 !important;
          border-radius: 50% !important;
        }
        .send-text {
          display: none;
        }
        .outside-reveal-btn {
          height: 50px;
          padding: 0 15px;
          font-size: 0.95em;
        }

        /* Center on mobile, scroll only if buttons exceed width */
        .action-bar {
          flex-wrap: nowrap;
          overflow-x: auto;
          justify-content: flex-start; /* Required for scrolling */
          padding-left: 15px; /* Add some padding so buttons don't hit edge when scrolling */
          padding-right: 15px;
          scrollbar-width: none;
          -webkit-overflow-scrolling: touch;
        }

        /* If items are fewer, this ensures they look centered on mobile */
        .action-bar::before,
        .action-bar::after {
          content: "";
          margin: auto;
        }

        .action-bar::-webkit-scrollbar {
          display: none;
        }

        .btn-row {
          flex-direction: column;
          gap: 10px;
          width: 100%;
        }
        .btn-row .reveal-btn,
        .btn-row .send-btn {
          width: 100%;
          height: 50px;
          border-radius: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <button class="top-right-about" onclick="toggleAbout()">About Us</button>

      <div class="stats-dashboard">
        <div class="stat-item">🔥 <span id="streak-count">0</span> Days</div>
        <div class="stat-item">🧩 <span id="riddle-count">0</span> Solved</div>
        <div class="stat-item">⏱️ <span id="time-spent">0</span>m Active</div>
      </div>

      <div class="chat-box" id="chat-box">
        <div class="chat-header" id="hero-area">
          <span class="gradient-text">Think First.</span>
          <div class="sub-greeting" id="sub-greeting">
            Loading inspiration...
          </div>
          <div class="suggestions-container" id="suggestions"></div>
        </div>
      </div>

      <div class="bottom-section">
        <div class="bottom-area-row">
          <div class="input-wrapper">
            <input
              type="text"
              id="user-input"
              placeholder="Ask me anything..."
              onkeypress="handleKeyPress(event)"
              autocomplete="off"
            />
            <button class="send-btn" onclick="sendMessage()">
              <span class="send-text">Send</span>
              <span style="font-size: 1.2em">↑</span>
            </button>
          </div>
          <button
            class="outside-reveal-btn"
            onclick="useSuggestion('I give up, please give me the answer.')"
            title="Reveal Answer"
          >
            👀 Reveal
          </button>
        </div>
        <div class="action-bar">
          <button class="action-btn" onclick="toggleGame()">
            🧠 Brain Training
          </button>
          <button class="action-btn" onclick="useSuggestion('Start a quiz')">
            📝 Quiz Me
          </button>
          <button
            class="action-btn"
            onclick="useSuggestion('Give me a random riddle')"
          >
            🎲 Riddle
          </button>
        </div>
      </div>

      <div class="game-overlay" id="game-overlay">
        <button class="close-game-btn" onclick="toggleGame()">&times;</button>
        <div class="game-card">
          <div id="game-menu-view" class="view-container">
            <h1 class="gradient-text game-title" style="font-size: 3.5em">
              Select Training
            </h1>
            <button
              class="action-btn"
              style="
                width: 100%;
                max-width: 400px;
                padding: 15px;
                margin-bottom: 15px;
              "
              onclick="openGame('scramble')"
            >
              🔠 Word Scramble</button
            ><br />
            <button
              class="action-btn"
              style="
                width: 100%;
                max-width: 400px;
                padding: 15px;
                margin-bottom: 15px;
              "
              onclick="openGame('math')"
            >
              🔢 Math Sprint</button
            ><br />
            <button
              class="action-btn"
              style="width: 100%; max-width: 400px; padding: 15px"
              onclick="openGame('color')"
            >
              🎨 Color Clash
            </button>
          </div>

          <div
            id="game-scramble-view"
            class="view-container"
            style="display: none"
          >
            <button class="back-btn" onclick="openGame('menu')">
              ← Back to Menu
            </button>
            <h1 class="gradient-text game-title">Word Scramble</h1>
            <div class="diff-container">
              <button
                class="diff-btn scramble-diff"
                id="scramble-easy"
                onclick="setScrambleDifficulty('easy')"
              >
                Easy
              </button>
              <button
                class="diff-btn scramble-diff active"
                id="scramble-medium"
                onclick="setScrambleDifficulty('medium')"
              >
                Medium
              </button>
              <button
                class="diff-btn scramble-diff"
                id="scramble-hard"
                onclick="setScrambleDifficulty('hard')"
              >
                Hard
              </button>
            </div>
            <div
              id="scrambled-word"
              style="
                font-size: 3.5em;
                color: #38bdf8;
                margin: 20px 0;
                font-weight: bold;
                word-break: break-all;
              "
            ></div>
            <div
              id="scramble-hint"
              class="hint-text"
              style="
                background: rgba(15, 23, 42, 0.5);
                padding: 15px;
                border-radius: 12px;
                border-left: 4px solid #38bdf8;
                text-align: left;
                margin-bottom: 20px;
              "
            ></div>
            <input
              type="text"
              id="scramble-input"
              class="game-input-box"
              placeholder="Your Answer..."
              autocomplete="off"
              onkeypress="handleScrambleKeyPress(event)"
            />
            <div
              id="scramble-message"
              style="margin-bottom: 20px; font-weight: bold"
            ></div>
            <div class="btn-row">
              <button class="reveal-btn" onclick="revealScramble()">
                Reveal
              </button>
              <button
                class="send-btn"
                style="flex-grow: 1"
                onclick="checkScrambleAnswer()"
              >
                Check
              </button>
            </div>
          </div>

          <div id="game-math-view" class="view-container" style="display: none">
            <button class="back-btn" onclick="openGame('menu')">
              ← Back to Menu
            </button>
            <h1 class="gradient-text game-title">Math Sprint</h1>
            <div class="diff-container">
              <button
                class="diff-btn math-diff"
                id="math-easy"
                onclick="setMathDifficulty('easy')"
              >
                Easy
              </button>
              <button
                class="diff-btn math-diff active"
                id="math-medium"
                onclick="setMathDifficulty('medium')"
              >
                Medium
              </button>
              <button
                class="diff-btn math-diff"
                id="math-hard"
                onclick="setMathDifficulty('hard')"
              >
                Hard
              </button>
            </div>
            <div
              id="math-equation"
              style="
                font-size: 4em;
                color: #818cf8;
                margin: 30px 0;
                font-weight: bold;
              "
            ></div>
            <input
              type="number"
              id="math-input"
              class="game-input-box"
              placeholder="Your Answer..."
              autocomplete="off"
              onkeypress="handleMathKeyPress(event)"
            />
            <div
              id="math-message"
              style="margin-bottom: 20px; font-weight: bold"
            ></div>
            <div class="btn-row">
              <button class="reveal-btn" onclick="revealMath()">Reveal</button>
              <button
                class="send-btn"
                style="flex-grow: 1"
                onclick="checkMathAnswer()"
              >
                Submit
              </button>
            </div>
          </div>

          <div
            id="game-color-view"
            class="view-container"
            style="display: none"
          >
            <button class="back-btn" onclick="openGame('menu')">
              ← Back to Menu
            </button>
            <h1 class="gradient-text game-title">Color Clash</h1>
            <div
              id="color-word"
              style="font-size: 5em; margin: 40px 0; font-weight: bold"
            >
              RED
            </div>
            <div
              id="color-message"
              style="margin-bottom: 20px; font-weight: bold"
            ></div>
            <div class="btn-row">
              <button
                class="send-btn"
                style="
                  flex-grow: 1;
                  border: 1px solid #f43f5e;
                  color: #f43f5e;
                  background: transparent;
                "
                onclick="checkColorAnswer(false)"
              >
                No
              </button>
              <button
                class="send-btn"
                style="
                  flex-grow: 1;
                  border: 1px solid #38bdf8;
                  color: #38bdf8;
                  background: transparent;
                "
                onclick="checkColorAnswer(true)"
              >
                Yes
              </button>
            </div>
          </div>
        </div>
      </div>

      <div
        class="game-overlay"
        id="about-overlay"
        style="background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(15px)"
      >
        <button class="close-game-btn" onclick="toggleAbout()">&times;</button>
        <div class="modal-card">
          <h2 style="margin-bottom: 15px; color: #38bdf8">About Think First</h2>
          <p style="line-height: 1.6; color: #cbd5e1; margin-bottom: 20px">
            A project to sharpen your mind.
          </p>
          <p style="font-size: 0.9em; color: #94a3b8">Developed by:</p>
          <h3 style="color: #fff">Prashant Singh Suriya</h3>
          <h3 style="color: #fff">Nitish Tomar</h3>
        </div>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById("chat-box");
      const userInput = document.getElementById("user-input");
      const heroArea = document.getElementById("hero-area");
      const suggestionsBox = document.getElementById("suggestions");
      let isFirstMessage = true;

      const motivationalLines = [
        "Fuel your curiosity.",
        "Small steps every day.",
        "Knowledge is your superpower.",
        "Think outside the box.",
        "Stay curious.",
      ];

      function setRandomGreeting() {
        const greetingEl = document.getElementById("sub-greeting");
        if (greetingEl)
          greetingEl.innerText =
            motivationalLines[
              Math.floor(Math.random() * motivationalLines.length)
            ];
      }

      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;
        if (isFirstMessage) {
          heroArea.style.display = "none";
          isFirstMessage = false;
        }
        appendMessage("user", message);
        userInput.value = "";

        const loadingId = "loading-" + Date.now();
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot-message";
        loadingDiv.id = loadingId;
        loadingDiv.innerText = "...";
        chatBox.appendChild(loadingDiv);

        try {
          const response = await fetch("/get_response", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message }),
          });
          const data = await response.json();
          document.getElementById(loadingId).remove();
          appendMessage("bot", data.reply);
        } catch (error) {
          document.getElementById(loadingId).remove();
          appendMessage("bot", "Error: Check your server.");
        }
      }

      function appendMessage(sender, text) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}-message`;
        msgDiv.innerHTML = sender === "bot" ? marked.parse(text) : text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
      }
      function useSuggestion(text) {
        userInput.value = text;
        sendMessage();
      }
      function toggleAbout() {
        document.getElementById("about-overlay").classList.toggle("active");
      }
      function toggleGame() {
        document.getElementById("game-overlay").classList.toggle("active");
        if (
          document.getElementById("game-overlay").classList.contains("active")
        )
          openGame("menu");
      }

      function openGame(gameType) {
        document
          .querySelectorAll(".view-container")
          .forEach((v) => (v.style.display = "none"));
        document.getElementById(`game-${gameType}-view`).style.display =
          "block";
        if (gameType === "scramble") loadNewScramble();
        if (gameType === "math") loadNewMath();
        if (gameType === "color") loadNewColor();
      }

      // Word Scramble Logic
      let currentScrambleWord = "";
      async function loadNewScramble() {
        const wordEl = document.getElementById("scrambled-word");
        const hintEl = document.getElementById("scramble-hint");
        wordEl.innerText = "FETCHING...";
        try {
          const res = await fetch(
            "https://random-word-api.herokuapp.com/word?length=6",
          );
          const data = await res.json();
          currentScrambleWord = data[0].toUpperCase();
          wordEl.innerText = currentScrambleWord
            .split("")
            .sort(() => 0.5 - Math.random())
            .join("");
          hintEl.innerText = "Hint: Unscramble this 6-letter word!";
        } catch {
          wordEl.innerText = "ERROR";
        }
      }
      function revealScramble() {
        document.getElementById("scramble-message").innerText =
          "Answer: " + currentScrambleWord;
        setTimeout(loadNewScramble, 2000);
      }
      function checkScrambleAnswer() {
        const val = document
          .getElementById("scramble-input")
          .value.toUpperCase();
        if (val === currentScrambleWord) {
          document.getElementById("scramble-message").innerText = "Correct! 🎉";
          incrementSolved();
          setTimeout(loadNewScramble, 1000);
        } else {
          document.getElementById("scramble-message").innerText = "Try Again!";
        }
        document.getElementById("scramble-input").value = "";
      }
      function handleScrambleKeyPress(e) {
        if (e.key === "Enter") checkScrambleAnswer();
      }

      // Math Logic
      let currentMathAnswer = 0;
      function loadNewMath() {
        const n1 = Math.floor(Math.random() * 20);
        const n2 = Math.floor(Math.random() * 20);
        currentMathAnswer = n1 + n2;
        document.getElementById("math-equation").innerText = `${n1} + ${n2}`;
      }
      function revealMath() {
        document.getElementById("math-message").innerText =
          "Answer: " + currentMathAnswer;
        setTimeout(loadNewMath, 2000);
      }
      function checkMathAnswer() {
        const val = parseInt(document.getElementById("math-input").value);
        if (val === currentMathAnswer) {
          incrementSolved();
          loadNewMath();
        }
        document.getElementById("math-input").value = "";
      }
      function handleMathKeyPress(e) {
        if (e.key === "Enter") checkMathAnswer();
      }

      // Color Logic
      let isColorMatch = false;
      function loadNewColor() {
        const colors = ["#f43f5e", "#38bdf8", "#10b981", "#f59e0b"];
        const names = ["RED", "BLUE", "GREEN", "YELLOW"];
        const idx1 = Math.floor(Math.random() * 4);
        const idx2 = Math.floor(Math.random() * 4);
        isColorMatch = idx1 === idx2;
        const el = document.getElementById("color-word");
        el.innerText = names[idx1];
        el.style.color = colors[idx2];
      }
      function checkColorAnswer(guess) {
        if (guess === isColorMatch) incrementSolved();
        loadNewColor();
      }

      // Stats
      let solvedCount = parseInt(localStorage.getItem("solvedCount")) || 0;
      let totalMinutes = parseInt(localStorage.getItem("totalMinutes")) || 0;
      let streakCount = parseInt(localStorage.getItem("streakCount")) || 0;
      function updateStatsDisplay() {
        document.getElementById("riddle-count").innerText = solvedCount;
        document.getElementById("time-spent").innerText = totalMinutes;
        document.getElementById("streak-count").innerText = streakCount;
      }
      setInterval(() => {
        totalMinutes++;
        localStorage.setItem("totalMinutes", totalMinutes);
        updateStatsDisplay();
      }, 60000);
      function incrementSolved() {
        solvedCount++;
        localStorage.setItem("solvedCount", solvedCount);
        updateStatsDisplay();
      }

      window.onload = () => {
        setRandomGreeting();
        updateStatsDisplay();
      };
    </script>
  </body>
</html>
